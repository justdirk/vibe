name: Point toolkit cards at the new domains (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolkit-domains.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rewrite the PressDuo and Condivida cards
        id: edit
        run: |
          python3 - <<'PYEOF'
          import os, sys
          p = 'index.html'
          s = open(p, encoding='utf-8').read()
          out = os.environ.get('GITHUB_OUTPUT', '/dev/null')
          if 'condivida.com' in s and 'pressduo.com' in s:
              print('already applied'); open(out, 'a').write('changed=0\n'); sys.exit(0)
          NL = chr(10)
          reps = []
          reps.append(('>PitchAgent</div>', '>PressDuo</div>'))
          reps.append(('"https://outreach.dirk.it" rel="noopener"', '"https://pressduo.com" rel="noopener"'))
          reps.append(('>outreach.dirk.it →</span>', '>pressduo.com →</span>'))
          reps.append(('href="https://outreach.dirk.it" style="font-size:14px;color:#9B958A" rel="noopener">PitchAgent</a>', 'href="https://pressduo.com" style="font-size:14px;color:#9B958A" rel="noopener">PressDuo</a><a href="https://condivida.com" style="font-size:14px;color:#9B958A" rel="noopener">Condivida</a>'))
          reps.append(('<div style="background:#0A0A09;padding:36px;display:flex;flex-direction:column;gap:12px">', '<a href="https://condivida.com" rel="noopener" style="background:#0A0A09;padding:36px;display:flex;flex-direction:column;gap:12px;color:#F2EFE9">'))
          reps.append(('VaultPro <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#E0B15C;border:1px solid rgba(224,177,92,.4);padding:3px 8px">Coming soon</span>', 'Condivida'))
          reps.append(('<span style="font-size:14px;font-weight:600;color:#8A8478;margin-top:auto">vault.dirk.it</span>' + NL + '      </div>', '<span style="font-size:14px;font-weight:600;color:#E0B15C;margin-top:auto">condivida.com →</span>' + NL + '      </a>'))
          for old, new in reps:
              n = s.count(old)
              print('count', n, '::', old[:60])
              assert n == 1, 'anchor not found exactly once: ' + old[:80]
              s = s.replace(old, new)
          open(p, 'w', encoding='utf-8').write(s)
          open(out, 'a').write('changed=1\n')
          print('rewritten')
          PYEOF

      - name: Show the diff
        if: steps.edit.outputs.changed == '1'
        run: git --no-pager diff --stat

      - name: Commit and remove this workflow
        if: steps.edit.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/toolkit-domains.yml
          git add index.html
          git commit -m "site: PressDuo at pressduo.com, Condivida live at condivida.com"
          git push origin main
